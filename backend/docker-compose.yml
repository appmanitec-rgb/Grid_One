name: manitec_gridone

services:
  postgres:
    image: postgres:15-alpine
    container_name: gridone_db
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - gridone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gridone_cache
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  gridone_pgdata:
